version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: floodguard_db
    environment:
      POSTGRES_USER: floodguard
      POSTGRES_PASSWORD: floodguard_secure_password
      POSTGRES_DB: floodguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodguard -d floodguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodguard_backend
    environment:
      - DATABASE_URL=postgresql://floodguard:floodguard_secure_password@db:5432/floodguard
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodguard_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
